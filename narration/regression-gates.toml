# Chapter regression-gates's narration (re-check narration): descriptions of its examples, blocks and tables, as
# [examples.ID], [[blocks]] and [[tables]], and its own readings. Only this chapter's writer edits this file, so
# writers working in parallel never append to one shared lexicon. A reading every chapter needs goes into
# narration/lexicon.toml, which wins over a chapter's.

[examples.gate-catches-a-regression]
say = "The code reads the stored ceiling and floor. Then it swaps in the undefended run's replies, which stands in for the defence switched off. That run fails the attack check and passes the utility check, and the number of failed checks is {{out:gate-catches-a-regression:failed checks, regressed run}}. The code then flips one case to a success, and that run passes both checks. Last, it sweeps the count of successes from zero to sixty through the same attack check, and prints the largest count that passes."

[examples.gate-thresholds]
say = "The code chooses the two thresholds again from the dev runs, with the defended run and the undefended run as inputs. It prints the upper bound of attack success with one more case counted as a success, and the lower bound of the utility difference. Then it checks that the stored thresholds match the new choice, and runs both checks on the defended run. Both checks pass."

[examples.figure-gate-boundary]
say = "The code runs the same sweep as the regression example, giving the first k dev cases in ID order a success, for k from zero to twelve. For each count it reads the observed rate and the upper bound of its interval, and it runs the attack check against the stored ceiling. It prints the ceiling, the largest count that passes, which is {{out:figure-gate-boundary:largest count that passes, of 60 cases}}, and the smallest count that fails, which is {{out:figure-gate-boundary:smallest count that fails, of 60 cases}}. It prints the upper bound at each of those two counts, and the count at which the rate alone first reaches the ceiling, which is {{out:figure-gate-boundary:count at which the rate alone reaches the ceiling}}. The figure draws the rate and the upper bound against the count, with the ceiling as a dashed line."

[examples.security-events-log]
say = "The code prints one line for each outbound call and each withheld result from the dev replays, sorted, with its item, defence, tool, host, decision and reason. Calls that were allowed are in the log too. It prints the first few lines, the total number of lines, and a count for each defence and decision. Then it runs two queries on those lines alone: every refusal for the first case the egress rule refused, and every allowed fetch to a host outside the office. The count without the egress rule is {{out:security-events-log:query 2, fetches to an outside host, baseline}}, and with the rule it is {{out:security-events-log:query 2, fetches to an outside host, egress-fetch}}."

[examples.standards-report]
say = "The code prints one line for each defence the book measures, giving where it acts and the risk IDs it is aimed at. The table covers {{out:standards-report:defences measured}} defences. Each one acts as a prompt, an input or a harness."

