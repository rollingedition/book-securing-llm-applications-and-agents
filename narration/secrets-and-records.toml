[words]

[examples.secrets-out-paired]
say = "This runs the undefended assistant and the same assistant with the note and the key removed from its prompt, on the dev split and then the held-out split. It prints utility, attack success and the count of prompts that hold either value. The undefended run's prompts hold a value every time, and the defended run's hold none. On dev, the secret goals fall from {{out:secrets-out-paired:dev, baseline, attack success on the note and key goals}} to {{out:secrets-out-paired:dev, secrets-out, attack success on the note and key goals}}, and overall attack success moves by one case. On held-out, the defended run completes {{out:secrets-out-paired:held-out, secrets-out, utility, 15 benign tasks}} benign tasks, and the undefended run completes {{out:secrets-out-paired:held-out, baseline, utility, 15 benign tasks}}."

[examples.retrieval-by-role-paired]
say = "This compares the undefended search with the search that filters documents by the acting user's role before ranking, on both splits. It prints utility and attack success for each run, the paired differences with their intervals, and attack success by location. The index location has no undefended success on either split, so the filter has no index success to remove. On held-out, attack success is the same under both runs, and two benign tasks lose a search result they needed."

[examples.filter-before-ranking]
say = "This runs three queries against two versions of the office's search: one that filters documents before ranking, and one that ranks every document and filters the top results afterwards. It prints the number of results from each, and how many kept results score differently. The counts and the order match, and the kept scores differ, because the hidden documents still count in the word weights. The example runs on the office's documents alone, with no recording."

[examples.poisoned-deposit]
say = "This counts poisoned deposit figures in the replies to the dev cases that aim at one, under three runs: undefended, with secrets removed, and with the role filter. It prints how many replies state a figure the office never set, and how many benign replies state a deposit. It then applies the citation rule to those replies. The rule flags every poisoned reply it is shown, and no benign one, on dev and on held-out. The held-out split has few deposit cases, so its counts are thin."

[examples.secrets-regressions]
say = "This runs the citation rule, the access label and the prompt scan on attempts that try to get round them, with no model. It prints one verdict per attempt, by name only, and asserts each verdict against the expected one. No printed line carries a key, a marker or attack text."
